name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: core module
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go build ./...
      - run: go vet ./...
      # -race needs cgo; run the race pass separately from the CGO_ENABLED=0 build.
      - run: CGO_ENABLED=1 go test -race -cover ./...

      # The examples are the executable integration tests (mocks only, no keys).
      - name: examples run end to end
        run: |
          go run ./examples/rag-chatbot
          go run ./examples/local-routing
          go run ./examples/coding-agent
          # Dry run by default; exits 0 and explains itself when no CLI is installed.
          go run ./examples/cli-provider
          go run ./examples/streaming
          go run ./examples/observability
          go run ./examples/observability -break

      # Fails the build if the >=30% input-token reduction claim regresses.
      - run: go run ./benchmarks

      - name: core module has no third-party dependencies
        run: |
          # The module path appears here. If it is ever renamed again, this
          # line must move with it — it silently flags every internal package
          # as third-party otherwise, which is how this broke once already.
          deps=$(go list -deps ./... \
            | grep -E '^[^/]+\.[^/]+/' | grep -v '^github.com/JMjirapat/tokipe' || true)
          if [ -n "$deps" ]; then
            echo "unexpected third-party dependencies in the core module:"
            echo "$deps"
            exit 1
          fi

  submodules:
    name: nested module ${{ matrix.mod }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod:
          - stores/pgvector
          - metrics/otel
          - toolcache/redis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: build and test
        working-directory: ${{ matrix.mod }}
        run: |
          go build ./...
          go vet ./...
          go test -race ./...

  # pgvector against a real database. Kept separate from the matrix above so a
  # service container is only started for the one module that needs it, and so
  # a database outage cannot fail the other two modules' builds.
  pgvector-integration:
    name: pgvector integration (real database)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Without this the job races the container: Go connects before Postgres
        # is accepting connections and the run fails for the wrong reason.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: run the integration tests
        working-directory: stores/pgvector
        env:
          AGENTKIT_PGVECTOR_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          go test -race -count=1 -run TestIntegration -v ./...
      - name: fail if the integration tests were skipped
        working-directory: stores/pgvector
        env:
          AGENTKIT_PGVECTOR_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        # A skipped credential-gated test looks identical to a passing one in
        # CI output. This job exists specifically to run them, so a skip here is
        # a failure — otherwise the coverage claim silently rots.
        run: |
          out=$(go test -count=1 -run TestIntegration -v ./... 2>&1)
          echo "$out"
          if echo "$out" | grep -q -- "--- SKIP"; then
            echo "::error::pgvector integration tests were skipped in the job that exists to run them"
            exit 1
          fi
